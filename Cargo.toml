[package]
name = "shortlinker"
version = "0.6.1"
description = "A minimalist URL shortener service supporting HTTP 307 redirection, built with Rust. Easy to deploy and lightning fast."
authors = ["AptS-1547 <apts-1547@esaps.net>"]
repository = "https://github.com/AptS-1547/shortlinker"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[features]
default = ["server", "cli"]  # 默认启用服务器和CLI功能
server = []           # 服务器功能（核心）
cli = ["server"]      # CLI功能（依赖服务器）
metrics = [
    "server",
    "dep:aster_forge_observability",
    "aster_forge_observability/prometheus",
    "aster_forge_metrics/backend-prometheus",
]  # Prometheus 指标导出
openapi = [
    "server",
    "dep:utoipa",
    "aster_forge_api_docs_macros/openapi",
]  # OpenAPI 文档和前端类型生成
full = ["server", "cli", "metrics", "openapi"]  # 全功能版本

# 开发构建优先缩短「改代码 -> 编译/测试」的反馈时间。
# 工作区代码保持 O0 以避免每次修改后重做优化；第三方依赖单独使用 O1，
# 避免 crypto/image/compression 等依赖在 debug/test 运行时过慢。
[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
debug = 1
panic = "unwind"
strip = false
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# Keep ordinary request/task panics from taking down every HTTP worker. Stack overflow and OOM
# remain process-fatal and must be prevented at their input/allocation boundaries.
panic = "unwind"
strip = true

# 压测/火焰图采样用：接近 release，但保留符号并关闭 LTO，方便 perf 展开栈。
# frame pointer 需要通过 RUSTFLAGS 传入：
# RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
[profile.profiling]
inherits = "release"
opt-level = 2
codegen-units = 1
debug = true
strip = false
lto = false
panic = "unwind"

[profile.release-performance]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

# 添加库配置
[lib]
name = "shortlinker"
path = "src/lib.rs"

[lints]
workspace = true

# 二进制配置
[[bin]]
name = "shortlinker"
path = "src/main.rs"

[workspace]
members = [".", "migration"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
# 存量测试代码(docstrings/format!/测试辅助函数)为主的低信噪比 pedantic 项:
# 对 #[cfg(test)] 辅助函数强加 must_use/# Errors 段、给专有名词加反引号属于
# 纯噪音;安全硬约束(cast/unsafe/allow_attributes 系列)保持 deny 不放行。
doc_markdown = "allow"
uninlined_format_args = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Pin all Forge mechanisms together to the exact published crates.io versions.
aster_forge_middleware = { version = "=0.1.0-alpha.6", features = ["metrics"] }
aster_forge_observability = { version = "=0.1.0-alpha.5" }
aster_forge_api_docs_macros = { version = "=0.1.0-alpha.1" }
aster_forge_cache = { version = "=0.1.0-alpha.4", features = ["bloom", "memory", "redis"] }
aster_forge_config = { version = "=0.1.0-alpha.4" }
aster_forge_crypto = { version = "=0.1.0-alpha.4", features = ["password"] }
aster_forge_db = { version = "=0.1.0-alpha.5", features = ["system-config"] }
aster_forge_logging = { version = "=0.1.0-alpha.3" }
aster_forge_metrics = { version = "=0.1.0-alpha.5" }
aster_forge_panic = { version = "=0.1.0-alpha.4" }
aster_forge_runtime = { version = "=0.1.0-alpha.4" }
aster_forge_tasks = { version = "=0.1.0-alpha.4", features = ["runtime-component"] }
aster_forge_utils = { version = "=0.1.0-alpha.4" }
actix-web = { version = "4.20.0", features = ["compress-brotli", "compress-gzip"] }
# actix-server 2.7.0 uses `actix_rt::net` and `actix_rt::signal` without
# enabling the split features of actix-rt 2.16 (macros/net/signal are now
# opt-in); remove this once actix-server declares them.
actix-rt = "2.16.0"
actix-cors = "0.7.2"
actix-multipart = "0.8.9"
actix-service = "2.0.3"
anyhow = { version = "1.0.105", features = ["backtrace"] }
arc-swap = "1.9.5"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.10", features = ["derive"] }
colored = "3.1.1"
config = "0.15.27"
crossbeam-channel = "0.5.17"
csv = "1.4.0"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
maxminddb = "0.33.0"
moka = { version = "0.12.16", default-features = false, features = ["future", "sync"] }
num_cpus = { version = "1.17.0", default-features = false }
rand = { version = "0.10.4", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rust-embed = "8.14.0"
rustls = "0.23.46"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "macros", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["cli", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-mysql", "sqlx-sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }
tokio-util = "0.7.20"
toml = "1.2.3"
tracing = { version = "0.1.44", default-features = false }
ureq = { version = "3.5.2", features = ["json"] }
urlencoding = "2.1.3"
utoipa = { version = "6.0.0", features = ["actix_extras", "chrono", "repr"] }
uuid = { version = "1.29.3", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
] }
woothee = "0.13.0"
xxhash-rust = { version = "0.8.21", features = ["xxh64"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
migration = { path = "migration" }
nix = { version = "0.31.4", default-features = false, features = ["signal", "process", "fs"] }
rpassword = "7.5.5"

[dependencies]
aster_forge_middleware.workspace = true
aster_forge_observability = { workspace = true, optional = true }
aster_forge_api_docs_macros.workspace = true
aster_forge_cache.workspace = true
aster_forge_config.workspace = true
aster_forge_crypto.workspace = true
aster_forge_db.workspace = true
aster_forge_logging.workspace = true
